version: '3.8'

services:
  # 1. Lightweight Kubernetes Cluster (Rancher k3s Control Plane)
  k3s-server:
    image: rancher/k3s:v1.24.4-k3s1
    command: server --disable=traefik --tls-san=k3s-server --write-kubeconfig-mode=644
    tmpfs:
      - /run
      - /var/run
    privileged: true
    environment:
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=666
    ports:
      - "6443:6443"  # K8s API Port
      - "8080:80"    # Ingress HTTP Port (mapped to 8080 on localhost)
    volumes:
      - k3s-server-data:/var/lib/rancher/k3s
      - ./data/k3s:/output

  # 2. Redis (For local caching/metadata persistence)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  k3s-server-data:
