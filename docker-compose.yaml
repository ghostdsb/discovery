version: '3.8'

services:
  # 1. Discovery App
  discovery:
    build:
      context: .
      dockerfile: dev.Dockerfile
    ports:
      - "4000:4000"
    environment:
      - MIX_ENV=dev
      - PORT=4000
      - GIT_ACCESS_TOKEN=local_dev_token
      - GIT_REPO_URL=http://gitea:3000/discovery/gitops.git
    depends_on:
      - gitea
    volumes:
      - .:/app
      - /tmp/discovery-k8s:/tmp/discovery-k8s

  # 2. Gitea (Local Git Server for GitOps testing)
  gitea:
    image: gitea/gitea:1.15.6
    environment:
      - USER_UID=1000
      - USER_GID=1000
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea_data:/data

  # 3. Redis (For idempotency persistence)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  gitea_data:
