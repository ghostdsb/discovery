apiVersion: v1
kind: Namespace
metadata:
  name: discovery
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: discovery-sa
  namespace: discovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: discovery-pod-watcher
  namespace: discovery
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: discovery-pod-watcher-binding
  namespace: discovery
subjects:
- kind: ServiceAccount
  name: discovery-sa
  namespace: discovery
roleRef:
  kind: Role
  name: discovery-pod-watcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-app
  namespace: discovery
  labels:
    app: discovery-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-app
  template:
    metadata:
      labels:
        app: discovery-app
    spec:
      serviceAccountName: discovery-sa
      containers:
      - name: discovery-app
        image: discovery-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4000
        env:
        - name: MIX_ENV
          value: "dev"
        - name: PORT
          value: "4000"
        - name: CONNECTION_METHOD
          value: "service_account"
        - name: API_TOKEN
          value: "discovery-secret-token"
        - name: BASE_URL
          value: "http://discovery.localhost"
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-app
  namespace: discovery
spec:
  selector:
    app: discovery-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: discovery-ingress
  namespace: discovery
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: discovery.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: discovery-app
            port:
              number: 80
